name: Keep Supabase Awake

on:
  schedule:
    # GitHub Actions cron uses UTC. 00:17 UTC is 09:17 KST.
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query-database:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query the shared collection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_URL}" || -z "${SUPABASE_PUBLISHABLE_KEY}" ]]; then
            echo "::error::SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY secrets are required."
            exit 1
          fi

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 30 \
            --get \
            --data-urlencode "select=id" \
            --data-urlencode "id=eq.juno" \
            --data-urlencode "limit=1" \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            "${SUPABASE_URL%/}/rest/v1/food_map_collections"
