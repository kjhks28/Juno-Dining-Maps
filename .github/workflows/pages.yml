name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        env:
          NAVER_MAP_CLIENT_ID: ${{ secrets.NAVER_MAP_CLIENT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$NAVER_MAP_CLIENT_ID"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          NAVER_MAP_CLIENT_ID="$(printf '%s' "$NAVER_MAP_CLIENT_ID" | tr -d '\n\r')"
          SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | tr -d '\n\r')"
          SUPABASE_PUBLISHABLE_KEY="$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | tr -d '\n\r')"
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'supabase' --exclude 'server.mjs' --exclude 'CLAUDE.md' ./ _site/
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=$GITHUB_SHA\"|; s|href=\"auth.css\"|href=\"auth.css?v=$GITHUB_SHA\"|; s|src=\"app.js\"|src=\"app.js?v=$GITHUB_SHA\"|" _site/index.html
          find _site -type f -name '*.js' -exec sed -i -E "s|(from[[:space:]]+[\"'][^\"']+\.js)([\"'])|\1?v=$GITHUB_SHA\2|g; s|(import\([\"'][^\"']+\.js)([\"']\))|\1?v=$GITHUB_SHA\2|g" {} +
          printf 'export const NAVER_MAP_CLIENT_ID = "%s";\nexport const SUPABASE_URL = "%s";\nexport const SUPABASE_PUBLISHABLE_KEY = "%s";\n' "$NAVER_MAP_CLIENT_ID" "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > _site/js/config.local.js
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
