<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한입지도 — 나만의 맛집 아카이브</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Juno 맛집 리스트 홈"><span class="brand-mark">J</span><span>Juno 맛집 리스트</span></a>
    <div class="header-actions">
      <label class="search-box"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="식당명, 메뉴, 지역으로 검색" aria-label="맛집 검색"><button type="button" id="clearSearch" aria-label="검색어 지우기" hidden>×</button></label>
      <button class="auth-button" id="authButton">관리자 로그인</button>
      <button class="primary-button" id="openFormButton">＋ 맛집 기록하기</button>
    </div>
  </header>

  <main class="app-shell">
    <section class="map-panel">
      <div id="map" aria-label="맛집 지도"></div>
      <button class="locate-button" id="locateButton" title="내 위치로 이동">◎</button>
      <div class="map-count"><strong id="mapCount">0</strong>개의 맛집</div>
    </section>

    <aside class="dashboard">
      <div class="dashboard-head">
        <div><span class="eyebrow">COLLECTION</span><h2>나의 맛집 목록</h2></div>
        <span class="total-badge" id="totalBadge">0곳</span>
      </div>

      <div class="filter-block">
        <div class="filter-title"><span>목록</span></div>
        <div class="chips status-chips" id="statusFilters"></div>
      </div>
      <div class="filter-block">
        <div class="filter-title"><span>지역</span><button id="resetFilters">전체 초기화</button></div>
        <div class="chips province-chips" id="provinceFilters"></div>
        <div class="chips subregion-chips" id="regionFilters" hidden></div>
      </div>
      <div class="filter-block category-block">
        <div class="filter-title"><span>카테고리</span></div>
        <div class="chips category-chips" id="categoryFilters"></div>
      </div>
      <div class="filter-block">
        <div class="filter-title"><span>태그</span></div>
        <div class="chips tag-filter-chips" id="tagFilters"></div>
      </div>

      <div class="result-summary"><span id="resultText">전체 맛집</span><select id="sortSelect" aria-label="정렬"><option value="rating">평점 높은 순</option><option value="newest">최근 등록 순</option><option value="name">이름 순</option></select></div>
      <div class="restaurant-list" id="restaurantList"></div>
      <div class="empty-state" id="emptyState" hidden><span>🍽️</span><strong>조건에 맞는 맛집이 없어요</strong><p>필터를 바꾸거나 새로운 맛집을 기록해 보세요.</p></div>
    </aside>
  </main>

  <dialog id="restaurantDialog">
    <form id="restaurantForm" method="dialog">
      <div class="dialog-head"><div><span class="eyebrow" id="dialogEyebrow">NEW PLACE</span><h2 id="dialogTitle">맛집 기록하기</h2></div><button type="button" class="close-button" id="closeFormButton">×</button></div>
      <div class="form-grid">
        <label>목록 구분<select name="status" required><option value="visited">다녀온 맛집</option><option value="wishlist">가고 싶은 곳</option></select></label>
        <label>방문 날짜<input name="visitDate" type="date"></label>
        <label class="wide">식당 이름<input name="name" required maxlength="40" placeholder="예: 오래된 짬뽕집"></label>
        <label class="wide address-field">상호명 또는 주소<div class="address-search-row"><input name="address" required maxlength="100" placeholder="식당 이름이나 도로명 주소를 입력해 주세요"><button type="button" id="searchAddressButton">네이버 검색</button></div><span class="address-search-status" id="addressSearchStatus"></span><div class="address-results" id="addressResults" hidden></div></label>
        <label>지역<input name="region" required maxlength="20" placeholder="예: 서울 성동구"></label>
        <label>카테고리<select name="category" required><option value="">선택</option><option>한식</option><option>중식</option><option>일식</option><option>양식</option><option>카페</option><option>분식</option><option>기타</option></select></label>
        <label>세부 카테고리<input name="subcategory" required maxlength="30" placeholder="예: 간짜장"></label>
        <label>평점 (10점 만점)<input name="rating" type="number" min="0" max="10" step="0.1" placeholder="가고 싶은 곳은 비워도 돼요"></label>
        <label>방문 횟수<input name="visitCount" type="number" min="0" max="999" step="1" value="1"></label>
        <label>재방문 의사<select name="revisit"><option value="yes">꼭 다시 갈래요</option><option value="maybe">고민 중이에요</option><option value="no">재방문은 안 할래요</option><option value="unknown">아직 모르겠어요</option></select></label>
        <fieldset class="wide tag-fieldset"><legend>태그 (복수 선택)</legend><div class="tag-options" id="tagOptions"></div></fieldset>
        <label class="wide">메뉴별 평가<textarea name="menuReviews" maxlength="500" rows="3" placeholder="한 줄에 하나씩 입력해 주세요. 예:&#10;간짜장 9.4&#10;탕수육 8.8"></textarea></label>
        <label class="wide">사진 첨부 (최대 3장)<input name="photos" id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" multiple><small>각 5MB 이하 JPG, PNG, WebP · 수정할 때 비워두면 기존 사진이 유지됩니다.</small></label>
        <label class="wide">한 줄 코멘트<input name="comment" required maxlength="60" placeholder="이 집을 한 문장으로 남겨보세요"></label>
        <label class="wide">식당 설명<textarea name="description" required maxlength="300" rows="3" placeholder="메뉴, 분위기, 함께 간 사람 등 기억하고 싶은 내용을 적어주세요"></textarea></label>
      </div>
      <p class="form-status" id="formStatus" role="status"></p>
      <div class="dialog-actions"><button type="button" class="secondary-button" id="cancelFormButton">취소</button><button type="submit" class="primary-button" id="submitFormButton">지도에 기록하기</button></div>
    </form>
  </dialog>

  <dialog id="authDialog" class="auth-dialog"><form id="authForm" method="dialog"><div class="dialog-head"><div><span class="eyebrow">ADMIN</span><h2>관리자 로그인</h2></div><button type="button" class="close-button" id="closeAuthButton">×</button></div><label>관리자 이메일<input name="email" type="email" required autocomplete="email"></label><p class="form-status" id="authStatus" role="status"></p><button type="submit" class="primary-button" id="authSubmitButton">로그인 링크 받기</button></form></dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
